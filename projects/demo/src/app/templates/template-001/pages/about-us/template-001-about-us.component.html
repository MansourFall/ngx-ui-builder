<div id="about-us-page" class="about-us-page">
  <uib-zone id="template-001-about-us-page-body">
    <ng-template uib-template="text" let-config>
      <div>{{config.content}}</div>
    </ng-template>
    <ng-template uib-template="image" let-config>
      <img width="500" src="{{config.src}}" alt="landing page" />
    </ng-template>
  </uib-zone>
</div>
