<div *ngIf="uiConfig$ | async; let uiConfig">

<ng-container *ngIf="uiConfig.templateIdentifier === 'template-001'">
  <app-template-001 [uiConfig]="uiConfig"></app-template-001>
</ng-container>

<ng-container *ngIf="uiConfig.templateIdentifier === 'template-002'">
  <app-template-002 [uiConfig]="uiConfig"></app-template-002>
</ng-container>

  <ng-container *ngIf="uiConfig.templateIdentifier === 'prisma-01'">
    <prisma-01 [uiConfig]="uiConfig"></prisma-01>
  </ng-container>
